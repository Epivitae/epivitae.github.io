<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Globe</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      flex-shrink: 0;
    }

    #legend {
      position: absolute;
      bottom: 28px;
      right: 28px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 10px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #333;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      user-select: none;
      pointer-events: none;
    }

    #legend .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgb(26, 128, 255);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="globe"></canvas>
    <div id="legend">
      <span class="dot"></span>
      <span>Our collaborators</span>
    </div>
  </div>

  <script type="module">
    import createGlobe from 'https://esm.sh/cobe@0.6.5';

    const canvas = document.getElementById('globe');
    const container = document.getElementById('container');

    const markers = [
      { location: [31.2304, 121.4737],  size: 0.1  }, // Shanghai (ION)
      { location: [47.6062, -122.3321], size: 0.08 }, // Seattle (UW)
      { location: [23.1570, 113.3574], size: 0.05 }, // SCAU
      { location: [23.0970, 113.2975], size: 0.08 }, // Sun Yat-sen University
      { location: [28.2117, 112.9836], size: 0.05 }, // Xiangya Hospital
      { location: [30.3183, 120.0811], size: 0.05 }, // Westlake University
      { location: [39.9919, 116.3068], size: 0.05 }, // Peking University
      { location: [22.3795, 114.2005], size: 0.08 }, // Prince of Wales Hospital
      { location: [40.8075, -73.9626], size: 0.08 }, // Columbia University
      { location: [39.0720, -77.4643], size: 0.08 }, // Janelia Research Campus
      { location: [47.0804, 15.4695],  size: 0.08 }, // Medical University of Graz
      { location: [22.5333, 113.9292], size: 0.08 }, // SUSTech
      { location: [24.4798, 118.0894], size: 0.05 }, // Xiamen University
      { location: [22.5931, 113.9906], size: 0.08 }, // SIAT, CAS (Shenzhen)
    ];

    let phi = 0;
    let globe;

    const dpr = Math.min(window.devicePixelRatio, 2);

    function createGlobeInstance(width, height) {
      return createGlobe(canvas, {
        devicePixelRatio: dpr,
        width,
        height,
        phi: 0,
        theta: 0.28,
        dark: 0,
        diffuse: 1.2,
        mapSamples: 16000,
        mapBrightness: 6,
        baseColor: [1, 1, 1],
        markerColor: [0.1, 0.5, 1],
        glowColor: [1, 1, 1],
        markers,
        onRender: (state) => {
          state.phi = phi;
          phi += 0.005;
        }
      });
    }

    let prevSize = 0;

    function fitCanvas() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      const size = Math.min(w, h);

      canvas.style.width  = size + 'px';
      canvas.style.height = size + 'px';

      if (globe && Math.abs(size - prevSize) / prevSize < 0.3) return;

      const renderSize = Math.floor(size * dpr);
      if (globe) globe.destroy();
      globe = createGlobeInstance(renderSize, renderSize);
      prevSize = size;
    }

    const ro = new ResizeObserver(fitCanvas);
    ro.observe(container);
  </script>
</body>
</html>
