<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* 1. 铺满全屏，没有任何多余限制 */
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: transparent; 
    }
    /* 2. 容器使用 Flexbox 居中，哪怕外层变形，它也能稳住内部 */
    .globe-container { 
      width: 100%; 
      height: 100%; 
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* 3. 画布保持完美比例，object-fit 确保永远是完整的圆 */
    canvas { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
    }
    /* 标签样式不变 */
    .label {
      position: absolute; 
      bottom: 10px; 
      right: 10px; 
      font-size: 14px; 
      color: #666; 
      font-style: italic; 
      background-color: rgba(255,255,255,0.8); 
      padding: 4px 8px; 
      border-radius: 4px; 
      font-family: sans-serif; 
      display: flex; 
      align-items: center; 
      gap: 6px;
    }
    .blue-dot {
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      background-color: rgb(26, 128, 255);
    }
  </style>
</head>
<body>
  <div class="globe-container">
    <canvas id="cobe-globe" width="1000" height="1000"></canvas>
    <div class="label"><span class="blue-dot"></span>Our collaborators</div>
  </div>

  <script type="module">
    import createGlobe from 'https://cdn.jsdelivr.net/npm/cobe@0.6.3/+esm';
    const markers = [
      { name: "Shanghai (ION)", lat: 31.2304, lng: 121.4737, size: 0.1 },
      { name: "Seattle (UW)", lat: 47.6062, lng: -122.3321, size: 0.08 },
      { name: "SCAU", lat: 23.157, lng: 113.3574, size: 0.05 },
      { name: "Xiangya Hospital", lat: 28.2117, lng: 112.9836, size: 0.05 },
      { name: "Westlake University", lat: 30.3183, lng: 120.0811, size: 0.05 },
      { name: "Peking University", lat: 39.9919, lng: 116.3068, size: 0.05 },
      { name: "Prince of Wales Hospital", lat: 22.3795, lng: 114.2005, size: 0.08 },
      { name: "Janelia Research Campus", lat: 39.0720, lng: -77.4643, size: 0.08 },
      { name: "Medical University of Graz", lat: 47.0804, lng: 15.4695, size: 0.08 },
      { name: "SUSTech", lat: 22.5333, lng: 113.9292, size: 0.08 },
      { name: "Xiamen University", lat: 24.4798, lng: 118.0894, size: 0.05 }
    ];
    const cobeMarkers = markers.map(item => ({ location: [item.lat, item.lng], size: item.size }));
    let phi = 0;
    createGlobe(document.getElementById("cobe-globe"), {
      devicePixelRatio: 2.5, width: 1000, height: 1000, phi: 0, theta: 0, dark: 0,
      diffuse: 1.2, mapSamples: 16000, mapBrightness: 6, baseColor: [1, 1, 1],
      markerColor: [0.1, 0.5, 1], glowColor: [1, 1, 1], markers: cobeMarkers,
      onRender: (state) => { state.phi = phi; phi += 0.005; }
    });
  </script>
</body>
</html>
