<div id="globe-container" style="width: 100%; max-width: 500px; aspect-ratio: 1/1; margin: 2rem auto; background-color: transparent;">
  <canvas id="cobe-globe" width="1000" height="1000" style="width: 100%; height: 100%;"></canvas>
</div>

<script type="module">
  // 换用 skypack 的 CDN，兼容性更好
  // 删掉之前的 esm.sh 或 skypack 链接，换成 jsdelivr
    import createGlobe from 'https://cdn.jsdelivr.net/npm/cobe@0.6.3/+esm';

  // 确保在整个页面 DOM 加载完毕后再执行，防止找不到 canvas
  document.addEventListener("DOMContentLoaded", () => {
    console.log("🌍 3D 地球脚本开始执行...");

    const canvas = document.getElementById("cobe-globe");
    if (!canvas) {
      console.error("❌ 找不到 ID 为 cobe-globe 的 Canvas 元素");
      return;
    }

    try {
      // 1. 安全地读取 Jekyll 后台数据
      // 使用 default: '[]' 防止没有数据时输出空导致 JS 语法错误
      const rawDataString = '{{ site.data.locations | jsonify | default: "[]" }}';
      const rawData = JSON.parse(rawDataString);
      
      console.log("📍 从 locations.yml 成功获取数据:", rawData);

      // 2. 转换为 Cobe 格式
      const markers = (rawData || []).map(item => ({
        location: [item.lat, item.lng],
        size: item.size || 0.05
      }));

      let phi = 0;

      // 3. 渲染 3D 地球
      const globe = createGlobe(canvas, {
        devicePixelRatio: 2,
        width: 1000, 
        height: 1000,
        phi: 0,
        theta: 0,
        dark: 0, 
        diffuse: 1.2,
        mapSamples: 16000,
        mapBrightness: 6,
        baseColor: [1, 1, 1],       
        markerColor: [0.1, 0.5, 1], 
        glowColor: [1, 1, 1],       
        markers: markers,           
        onRender: (state) => {
          state.phi = phi;
          phi += 0.005; 
        }
      });
      
      console.log("✅ 3D 地球渲染成功！");

    } catch (error) {
      console.error("❌ 地球渲染或数据解析失败:", error);
    }
  });
</script>
