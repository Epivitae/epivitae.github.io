<div style="position: relative; width: 100%; max-width: 500px; height: 500px; margin: 2rem auto;">
  <canvas id="cobe-globe" width="1000" height="1000" style="width: 100%; height: 100%;"></canvas>
  <div style="position: absolute; bottom: 10px; right: 10px; font-size: 0.85em; color: #666; font-style: italic; background-color: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 4px; pointer-events: none;">
    📍 Our collaborators
  </div>
</div>

<script type="module">
  import createGlobe from 'https://cdn.jsdelivr.net/npm/cobe@0.6.3/+esm';

  // 1. 将渲染逻辑封装成一个独立的函数
  function renderGlobe() {
    console.log("🌍 开始尝试渲染 3D 地球...");
    
    const canvas = document.getElementById("cobe-globe");
    if (!canvas) {
      console.error("❌ 找不到 Canvas 容器！可能是页面被卸载。");
      return;
    }

    try {
      // 2. 利用 Jekyll 的 jsonify 直接输出 JS 对象，最安全的写法
      const rawData = {{ site.data.locations | jsonify | default: "[]" }};
      console.log("📍 从服务器读取到的数据：", rawData);

      const markersData = (Array.isArray(rawData) ? rawData : []).map(item => ({
        location: [item.lat, item.lng],
        size: item.size || 0.05
      }));

      let phi = 0;
      createGlobe(canvas, {
        devicePixelRatio: 2,
        width: 1000, 
        height: 1000,
        phi: 0,
        theta: 0,
        dark: 0,
        diffuse: 1.2,
        mapSamples: 16000,
        mapBrightness: 6,
        baseColor: [1, 1, 1],       
        markerColor: [0.1, 0.5, 1], 
        glowColor: [1, 1, 1],       
        markers: markersData, 
        onRender: (state) => {
          state.phi = phi;
          phi += 0.005; 
        }
      });
      
      console.log("✅ 3D 地球渲染成功！");
    } catch (e) {
      console.error("❌ 地球渲染过程中出现错误:", e);
    }
  }

  // 3. 【核心修复】智能判断执行时机，兼容各种主题的无刷新加载
  if (document.readyState === 'loading') {
    // 如果页面正在加载（比如直接强制刷新网页），等待加载完成后执行
    document.addEventListener('DOMContentLoaded', renderGlobe);
  } else {
    // 如果 DOM 已经准备好（比如从别的页面点击导航栏跳转过来），立刻执行！
    renderGlobe();
  }
</script>
