<div style="position: relative; width: 100%; max-width: 500px; height: 500px; margin: 2rem auto;">
  <canvas id="cobe-globe" width="1000" height="1000" style="width: 100%; height: 100%;"></canvas>
  <div style="position: absolute; bottom: 10px; right: 10px; font-size: 0.85em; color: #666; font-style: italic; background-color: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 4px; pointer-events: none;">
    📍 Our collaborators
  </div>
</div>

<script>
  function initGlobe() {
    console.log("🌍 开始尝试渲染 3D 地球...");
    const canvas = document.getElementById("cobe-globe");
    
    if (!canvas) {
      console.error("❌ 找不到 Canvas 容器！");
      return;
    }

    // 使用原生的动态 import() 加载 Cobe，这样就不需要 script 标签带 module 属性了
    import('https://cdn.jsdelivr.net/npm/cobe@0.6.3/+esm')
      .then(({ default: createGlobe }) => {
        try {
          // 利用 Jekyll 直接注入数据
          const rawData = {{ site.data.locations | jsonify | default: "[]" }};
          console.log("📍 从服务器读取到的数据：", rawData);

          const markersData = (Array.isArray(rawData) ? rawData : []).map(item => ({
            location: [item.lat, item.lng],
            size: item.size || 0.05
          }));

          let phi = 0;
          createGlobe(canvas, {
            devicePixelRatio: 2,
            width: 1000, 
            height: 1000,
            phi: 0,
            theta: 0,
            dark: 0,
            diffuse: 1.2,
            mapSamples: 16000,
            mapBrightness: 6,
            baseColor: [1, 1, 1],       
            markerColor: [0.1, 0.5, 1], 
            glowColor: [1, 1, 1],       
            markers: markersData, 
            onRender: (state) => {
              state.phi = phi;
              phi += 0.005; 
            }
          });
          
          console.log("✅ 3D 地球渲染成功！");
        } catch (e) {
          console.error("❌ 地球渲染逻辑出错:", e);
        }
      })
      .catch(err => {
        console.error("❌ 无法从 CDN 加载 Cobe 3D 库:", err);
      });
  }

  // 兼容直接强刷和导航栏无刷新跳转的两种情况
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGlobe);
  } else {
    // 稍微延迟 50 毫秒，确保 PJAX 已经把 canvas 元素塞进了网页里
    setTimeout(initGlobe, 50);
  }
</script>
