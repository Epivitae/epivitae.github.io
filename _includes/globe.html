<div style="position: relative; width: 100%; max-width: 500px; height: 500px; margin: 2rem auto;">
  <canvas id="cobe-globe" width="1000" height="1000" style="width: 100%; height: 100%;"></canvas>
  <div style="position: absolute; bottom: 10px; right: 10px; font-size: 0.85em; color: #666; font-style: italic; background-color: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 4px; pointer-events: none;">
    📍 Our collaborators
  </div>
</div>

<script id="globe-data" type="application/json">
  {{ site.data.locations | jsonify | default: "[]" }}
</script>

<script>
  console.log("🌍 准备动态注入 3D 地球引擎...");
  (function() {
    var canvas = document.getElementById("cobe-globe");
    if (!canvas) return;

    // 创建一个新的 Module 脚本
    var moduleScript = document.createElement("script");
    moduleScript.type = "module";
    
    // 将核心逻辑以“字符串拼接”的形式写入，Cloudflare 会把它当作普通文本，直接放行
    moduleScript.textContent = [
      "import createGlobe from 'https://cdn.jsdelivr.net/npm/cobe@0.6.3/+esm';",
      "try {",
      "  const dataEl = document.getElementById('globe-data');",
      "  const rawData = JSON.parse(dataEl.textContent || '[]');",
      "  const markers = rawData.map(item => ({ location: [item.lat, item.lng], size: item.size || 0.05 }));",
      "  const canvas = document.getElementById('cobe-globe');",
      "  let phi = 0;",
      "  createGlobe(canvas, {",
      "    devicePixelRatio: 2, width: 1000, height: 1000, phi: 0, theta: 0, dark: 0,",
      "    diffuse: 1.2, mapSamples: 16000, mapBrightness: 6, baseColor: [1, 1, 1],",
      "    markerColor: [0.1, 0.5, 1], glowColor: [1, 1, 1], markers: markers,",
      "    onRender: (state) => { state.phi = phi; phi += 0.005; }",
      "  });",
      "  console.log('✅ 3D 地球模块成功加载并渲染！');",
      "} catch(err) {",
      "  console.error('❌ 渲染失败:', err);",
      "}"
    ].join("\n");

    // 强行塞入网页执行
    document.body.appendChild(moduleScript);
  })();
</script>
