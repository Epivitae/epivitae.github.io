<div style="width: 100%; max-width: 500px; height: 500px; margin: 2rem auto;">
  <canvas id="cobe-globe" width="1000" height="1000" style="width: 100%; height: 100%;"></canvas>
</div>

<script type="module">
  import createGlobe from 'https://cdn.jsdelivr.net/npm/cobe@0.6.3/+esm';

  const canvas = document.getElementById("cobe-globe");
  let phi = 0;

  if (canvas) {
    createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 1000, 
      height: 1000,
      phi: 0,
      theta: 0,
      dark: 0, // 0是白底，如果你的主页是黑色的，请改成1
      diffuse: 1.2,
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [1, 1, 1],       
      markerColor: [0.1, 0.5, 1], // 蓝色的点
      glowColor: [1, 1, 1],       
      // 3. 直接写死经纬度，排除 Liquid 模板干扰
      markers: [
        { location: [31.2304, 121.4737], size: 0.1 }, 
        { location: [47.6062, -122.3321], size: 0.08 }
      ],           
      onRender: (state) => {
        state.phi = phi;
        phi += 0.005; 
      }
    });
  }
</script>
