<div style="position: relative; width: 100%; max-width: 500px; height: 500px; margin: 2rem auto;">
  <canvas id="cobe-globe" width="1000" height="1000" style="width: 100%; height: 100%;"></canvas>
  
  <div style="position: absolute; bottom: 10px; right: 10px; font-size: 0.85em; color: #666; font-style: italic; background-color: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 4px; pointer-events: none;">
    📍 Our collaborators
  </div>
</div>

<script type="module">
  import createGlobe from 'https://cdn.jsdelivr.net/npm/cobe@0.6.3/+esm';

  // 确保在 HTML 完全加载后再执行，防止找不到 canvas
  document.addEventListener("DOMContentLoaded", () => {
    console.log("🌍 开始尝试渲染 3D 地球...");
    
    const canvas = document.getElementById("cobe-globe");
    if (!canvas) {
      console.error("❌ 找不到 Canvas 容器！");
      return;
    }

    try {
      // 1. 【最安全的 Liquid 读取方式】先把它变成字符串，防止直接输出引发 JS 语法崩溃
      const rawDataString = '{{ site.data.locations | jsonify }}';
      let rawData = [];
      
      // 2. 只有当字符串有内容且不是 'null' 时，才去解析它
      if (rawDataString && rawDataString !== 'null' && rawDataString.trim() !== '') {
        rawData = JSON.parse(rawDataString);
      }
      
      console.log("📍 从服务器读取到的数据：", rawData);

      // 3. 转换为 Cobe 格式
      const markersData = rawData.map(item => ({
        location: [item.lat, item.lng],
        size: item.size || 0.05
      }));

      let phi = 0;

      // 4. 渲染地球
      createGlobe(canvas, {
        devicePixelRatio: 2,
        width: 1000, 
        height: 1000,
        phi: 0,
        theta: 0,
        dark: 0,
        diffuse: 1.2,
        mapSamples: 16000,
        mapBrightness: 6,
        baseColor: [1, 1, 1],       
        markerColor: [0.1, 0.5, 1], 
        glowColor: [1, 1, 1],       
        markers: markersData, 
        onRender: (state) => {
          state.phi = phi;
          phi += 0.005; 
        }
      });
      
      console.log("✅ 3D 地球渲染成功！");
    } catch (e) {
      // 如果出现任何意外错误，它会在这里红字打印出来，而不是默默白屏
      console.error("❌ 地球渲染过程中出现错误:", e);
    }
  });
</script>
