<div style="width: 100%; max-width: 500px; aspect-ratio: 1/1; margin: 2rem auto;">
  <canvas id="cobe-globe" style="width: 100%; height: 100%;"></canvas>
</div>

<script type="module">
  import createGlobe from 'https://esm.sh/cobe@0.6.3';

  // 1. 读取 Jekyll 后台数据
  const rawData = {{ site.data.locations | jsonify }};
  
  // 2. 确保数据存在并转换为 Cobe 需要的格式
  const markers = (rawData || []).map(item => ({
    location: [item.lat, item.lng],
    size: item.size
  }));

  const canvas = document.getElementById("cobe-globe");
  let phi = 0;

  // 3. 渲染 3D 地球
  if (canvas) {
    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 1000, 
      height: 1000,
      phi: 0,
      theta: 0,
      dark: 0, // 亮色模式，与多数学术主题的纯白背景契合
      diffuse: 1.2,
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [1, 1, 1],       
      markerColor: [0.1, 0.5, 1], // 蓝色点
      glowColor: [1, 1, 1],       
      markers: markers,           
      onRender: (state) => {
        state.phi = phi;
        phi += 0.005; // 控制自转速度
      }
    });
  }
</script>
