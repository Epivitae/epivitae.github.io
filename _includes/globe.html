<div style="position: relative; width: 100%; max-width: 500px; height: 500px; margin: 2rem auto;">
  <canvas id="cobe-globe" width="1000" height="1000" style="width: 100%; height: 100%;"></canvas>
  <div style="position: absolute; bottom: 10px; right: 10px; font-size: 0.85em; color: #666; font-style: italic; background-color: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 4px; pointer-events: none;">
    📍 Our collaborators
  </div>
</div>

<script data-cfasync="false">
  console.log("🌍 脚本开始执行！(绕过所有拦截机制)");
  
  // 2. 移除所有 DOMContentLoaded 和 setTimeout 等待逻辑。
  // 因为脚本物理位置就在 canvas 下方，浏览器解析到这里时，canvas 必然已经存在。直接执行！
  (function() {
    var canvas = document.getElementById("cobe-globe");
    if (!canvas) {
      console.error("❌ 找不到 canvas 元素，请检查 HTML 结构！");
      return;
    }

    // 3. 读取 Jekyll 注入的数据 (采用最兼容的 ES5 语法以防线上代码被意外压缩破坏)
    var rawData = {{ site.data.locations | jsonify | default: "[]" }};
    var markersData = [];
    if (Array.isArray(rawData)) {
      markersData = rawData.map(function(item) {
        return { location: [item.lat, item.lng], size: item.size || 0.05 };
      });
    }
    
    console.log("📍 成功解析数据：", markersData);

    // 4. 原生动态引入 Cobe 并渲染
    import('https://cdn.jsdelivr.net/npm/cobe@0.6.3/+esm')
      .then(function(module) {
        var createGlobe = module.default;
        var phi = 0;
        createGlobe(canvas, {
          devicePixelRatio: 2, 
          width: 1000, 
          height: 1000, 
          phi: 0, 
          theta: 0, 
          dark: 0,
          diffuse: 1.2, 
          mapSamples: 16000, 
          mapBrightness: 6, 
          baseColor: [1, 1, 1],       
          markerColor: [0.1, 0.5, 1], 
          glowColor: [1, 1, 1], 
          markers: markersData,
          onRender: function(state) { 
            state.phi = phi; 
            phi += 0.005; 
          }
        });
        console.log("✅ 云端 3D 地球渲染彻底成功！");
      })
      .catch(function(error) {
        console.error("❌ Cobe 库网络加载失败:", error);
      });
  })();
</script>
